<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora | Entornos de Desarrollo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #f1f4f8; color: #1c2635; font-family: Arial, sans-serif; padding: 20px; }
    main { width: min(100%, 460px); background: white; border-radius: 18px;
           padding: 32px; box-shadow: 0 12px 38px #18294118; }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { color: #526173; line-height: 1.5; }
    label { display: block; margin: 22px 0 8px; font-weight: bold; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #bac6d5;
            border-radius: 9px; font: inherit; }
    input:focus { outline: 2px solid #316de5; outline-offset: 2px; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
    button { border: none; border-radius: 9px; padding: 13px 8px; background: #265ed5;
             color: white; font: inherit; font-weight: bold; cursor: pointer; }
    button:hover { background: #1847aa; }
    small { display: block; margin-top: 20px; color: #667585; }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <p>Introduce dos números enteros entre -99999 y 99999 y selecciona la operación que deseas realizar.</p>
    <form action="/calcular" method="get">
      <label for="a">Primer número</label>
      <input id="a" name="a" type="number" min="-99999" max="99999" step="1" required>
      <label for="b">Segundo número</label>
      <input id="b" name="b" type="number" min="-99999" max="99999" step="1" required>
      <div class="buttons">
        <button type="submit" name="op" value="suma">Sumar</button>
        <button type="submit" name="op" value="resta">Restar</button>
        <button type="submit" name="op" value="multiplicacion">Multiplicar</button>
        <button type="submit" name="op" value="potencia">Potencia</button>
      </div>
    </form>
    <small>Valores permitidos: de -99999 a 99999. Solo números enteros.</small>
  </main>
</body>
</html>
